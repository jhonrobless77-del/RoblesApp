<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Planificador CC.SS. - V2</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-8">
    <div class="max-w-4xl mx-auto bg-white p-6 rounded shadow">
        <h1 class="text-xl font-bold mb-4">Nueva Planificación</h1>
        <input type="password" id="api-key" placeholder="API Key" class="w-full p-2 border mb-2">
        <input type="text" id="tema" placeholder="Tema de clase" class="w-full p-2 border mb-2">
        <button id="btn-run" class="bg-blue-600 text-white p-2 w-full">Generar Sesión</button>
        <div id="resultado" class="mt-4 p-4 bg-slate-50 border">Esperando datos...</div>
    </div>
    <script src="motor.js"></script>
</body>
</html>
